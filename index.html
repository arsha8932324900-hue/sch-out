<style>
@font-face{font-family:Vazirmatn;font-weight:100 900;font-display:swap;src:url(fonts/Vazirmatn.woff2) format("woff2")}
:root{--paper:#fbf5e4;--card:#fffdf6;--ink:#1b2a4a;--mut:#6a7490;--line:#e6dcc0;--grid:#2563eb0d;--hd:#1f3a68;--pencil:#f5b301;--red:#d9453f;--note:#fff1a8;--noteink:#5b4a00;
--l1:#2b8a3e;--l2:#1c7ed6;--l3:#d9730d;--l4:#d9453f;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}

a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}
h2,h3{margin:0}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;padding:calc(12px + var(--st)) 16px 14px;display:flex;align-items:center;gap:10px;border-radius:0 0 22px 22px;box-shadow:0 4px 0 #0000001a}
.logo{width:42px;height:42px;border-radius:13px;background:var(--pencil);display:grid;place-items:center;font-size:23px;flex:none;transform:rotate(-6deg);box-shadow:0 2px 0 #0003}

main{padding:16px 14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:15px;margin-bottom:14px;box-shadow:0 3px 0 var(--line)}
.card>h3,.sec{font-size:15.5px;font-weight:800;margin:0 0 12px;display:inline-block;background:linear-gradient(transparent 62%,#f5b30166 62%);padding:0 4px;border-radius:3px}

.bc.now .col i{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent)}
.anim .col i{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}.anim .bc:nth-child(2) i{animation-delay:.05s}.anim .bc:nth-child(3) i{animation-delay:.1s}.anim .bc:nth-child(4) i{animation-delay:.15s}.anim .bc:nth-child(5) i{animation-delay:.2s}.anim .bc:nth-child(6) i{animation-delay:.25s}.anim .bc:nth-child(7) i{animation-delay:.3s}.anim .bc:nth-child(8) i{animation-delay:.35s}
@keyframes grow{from{transform:scaleY(0)}}
.anim .ring-v{animation:fill 1s ease-out}@keyframes fill{from{stroke-dasharray:0 400}}
.anim .card,.anim .kpi{animation:rise .45s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(10px)}}

.m{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:center;padding:8px 0}

.m span{font-size:13.5px}.m b{font-size:14px}
.m .pb{grid-column:2/4;height:10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);overflow:hidden}
.m .pb u{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .8s}
.wk{padding:11px 0;border-bottom:1.5px dashed var(--line)}.wk:last-child{border:0}
.wk .h{display:flex;align-items:center;gap:10px}.wk .h b:first-child{flex:1}
.wk .d{font-size:12.5px;color:var(--mut);margin-top:3px}
.podium{display:flex;direction:ltr;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 10px}
.pd{flex:1;max-width:120px;text-align:center;direction:rtl}
.pd .av{margin:0 auto 4px}.pd b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .blk{margin-top:6px;border-radius:12px 12px 0 0;background:color-mix(in srgb,var(--c) 22%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);border-bottom:0;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--c)}
.pd.p1 .blk{height:96px}.pd.p2 .blk{height:72px}.pd.p3 .blk{height:54px}
.rk{width:30px;text-align:center;font-weight:800;color:var(--mut)}
.srch{position:relative}.srch::before{content:"🔍";position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);font-size:16px}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);outline:none}
input:focus{border-color:var(--hd);box-shadow:0 0 0 3px #1f3a6826}
.srch input{padding-inline-start:42px}
label{display:block;margin-bottom:13px;font-size:13px;color:var(--mut)}label input,label select{margin-top:5px;color:var(--ink)}
.btn{background:var(--hd);color:#fff;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;font-weight:700;box-shadow:0 3px 0 #0003}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:none;color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}.btn.d{background:none;color:var(--l4);border:1.5px solid var(--line);box-shadow:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:10px 0 2px;padding-bottom:4px}

.chip.on{background:var(--hd);border-color:var(--hd);color:#fff}
nav{position:fixed;inset:auto 10px calc(10px + var(--sb)) 10px;max-width:560px;margin:0 auto;background:var(--card);border:1.5px solid var(--line);border-radius:24px;display:flex;padding:6px;z-index:6;box-shadow:0 4px 0 var(--line),0 10px 24px #0002}
nav a{flex:1;text-align:center;padding:5px 0 3px;color:var(--mut);font-size:12px;border-radius:18px}
nav a b{display:block;font-size:21px;line-height:1.4;font-weight:400}
nav a.on{color:var(--ink);font-weight:800;background:color-mix(in srgb,var(--pencil) 38%,transparent)}
.ov{position:fixed;inset:0;background:var(--paper);z-index:20;overflow:auto;padding:calc(24px + var(--st)) 18px 40px}
.ov .box{max-width:420px;margin:0 auto}
.ov h2{margin:6px 0;font-size:21px}.ov svg{width:150px;margin:0 auto 6px}
.err{background:color-mix(in srgb,var(--l4) 13%,transparent);color:var(--l4);border-radius:12px;padding:9px 13px;margin:10px 0;font-size:13.5px}
.status{font-size:12px;text-align:center;color:var(--mut);margin:0 0 12px}
.back{display:inline-flex;gap:4px;align-items:center;margin-bottom:12px;font-weight:700;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:2px 14px}
.sk{height:110px;border-radius:20px;margin-bottom:14px;background:linear-gradient(100deg,var(--line) 30%,color-mix(in srgb,var(--line) 40%,transparent) 50%,var(--line) 70%) 0 0/300% 100%;animation:sh 1.3s linear infinite}@keyframes sh{to{background-position:-300% 0}}
svg{display:block;max-width:100%}

<body>
<header><div class="logo">🎒</div><h1 id="ttl">کارنامه مدرسه<small id="sub"></small></h1><button id="rf" aria-label="به‌روزرسانی" title="به‌روزرسانی">⟳</button><button id="gear" aria-label="تنظیمات" title="تنظیمات">⚙</button></header>
<main id="app"></main>
<nav id="nav"><a href="#/" data-t="home"><b>🏠</b>خانه</a><a href="#/rank" data-t="rank"><b>🏆</b>برترین‌ها</a><a href="#/students" data-t="students"><b>🎓</b>دانش‌آموزان</a></nav>
<div id="ov" class="ov" hidden></div>
<script src="config.js"></script>
<script>

"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fa = (n, d = 1) => (+n).toLocaleString("fa-IR", { maximumFractionDigits: d });
const wl = w => new Date(w + "T00:00").toLocaleDateString("fa-IR", { month: "short", day: "numeric" });
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};

// ---------- تنظیمات و وضعیت ----------
const cfg = () => ({ path: "data.enc.json", branch: "", refreshMinutes: 5, ...(window.APP_CONFIG || {}), ...LS.get("cfg", {}) });
let PW = LS.get("pw", "") || "";          // رمز فقط اگر کاربر «به‌خاطر بسپار» را زده باشد روی دستگاه می‌ماند
let TOK = LS.get("tok", "") || "";
let D = null, P = null, lastErr = "", busy = false, online = true;

// ---------- دریافت از GitHub ----------
async function pull() {
  const c = cfg();
  if (!c.repo) throw new Error("نام ریپو تنظیم نشده است");
  const url = `https://api.github.com/repos/${c.repo}/contents/${c.path.split("/").map(encodeURIComponent).join("/")}` + (c.branch ? `?ref=${encodeURIComponent(c.branch)}` : "");
  const h = { Accept: "application/vnd.github.raw+json", "X-GitHub-Api-Version": "2022-11-28" };
  if (TOK) h.Authorization = "Bearer " + TOK;
  const et = LS.get("etag", ""), have = LS.get("blob", "");
  if (et && have) h["If-None-Match"] = et;
  let r;
  try { r = await fetch(url, { headers: h, cache: "no-store" }); } catch { online = false; throw new Error("اتصال اینترنت برقرار نشد"); }
  online = true;
  if (r.status === 304) return false;
  if (r.status === 401) throw new Error("توکن نامعتبر یا منقضی است");
  if (r.status === 403) throw new Error("دسترسی ممکن نیست یا سقف درخواست GitHub پر شده؛ کمی بعد دوباره تلاش کنید");
  if (r.status === 404) throw new Error("فایل داده پیدا نشد. ریپو و نام فایل را بررسی کنید (برای ریپوی خصوصی توکن لازم است)");
  if (!r.ok) throw new Error("خطای GitHub (" + r.status + ")");
  const txt = await r.text();
  try { const e = JSON.parse(txt); if (!e.ct || !e.salt || !e.iv) throw 0; } catch { throw new Error("فایل داده معتبر نیست"); }
  LS.set("blob", txt); LS.set("etag", r.headers.get("ETag") || "");
  return true;
}

// ---------- رمزگشایی (PBKDF2-SHA256 + AES-256-GCM) ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(env, pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(env.salt), iterations: env.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let pt;
  try { pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(env.iv) }, key, b64(env.ct)); } catch { throw new Error("BADPW"); }
  return JSON.parse(new TextDecoder().decode(pt));
}

// ---------- پردازش داده ----------
function prep(d) {
  const st = new Map(d.students.map(s => [s.id, { ...s, recs: [] }]));
  d.records.forEach(r => { const s = st.get(r.student_id); if (s) s.recs.push(r); });
  const W = [...new Set(d.records.map(r => r.week))].sort();
  st.forEach(s => {
    s.recs.sort((a, b) => a.week < b.week ? -1 : 1);
    s.avg = mean(s.recs.map(r => r.score));
    s.last = s.recs[s.recs.length - 1] || null;
    s.trend = s.recs.length > 1 ? s.last.score - s.recs[s.recs.length - 2].score : 0;
  });
  const S = [...st.values()], active = S.filter(s => s.recs.length);
  const wavg = W.map(w => mean(d.records.filter(r => r.week === w).map(r => r.score)));
  return { S, st, W, wavg, active, rank: [...active].sort((a, b) => b.avg - a.avg), classes: [...new Set(S.map(s => s.class).filter(Boolean))].sort() };
}
async function unlockFromCache() {
  const txt = LS.get("blob", "");
  if (!txt || !PW) return false;
  D = await decrypt(JSON.parse(txt), PW);
  P = prep(D);
  return true;
}


// ---------- ظاهر ----------
const LVL = [["عالی", "🌟"], ["خوب", "👍"], ["متوسط", "📘"], ["نیازمند توجه", "💪"]];
const li = s => s >= 85 ? 0 : s >= 70 ? 1 : s >= 55 ? 2 : 3;
const lc = s => `var(--l${li(s) + 1})`;
const rl = r => `var(--l${r >= .85 ? 1 : r >= .7 ? 2 : r >= .55 ? 3 : 4})`;
const pill = s => `<span class="pill" style="--c:${lc(s)}">${LVL[li(s)][1]} ${LVL[li(s)][0]}</span>`;
const stamp = s => `<span class="stamp" style="--c:${lc(s)}">${LVL[li(s)][1]} ${LVL[li(s)][0]}</span>`;
const hue = id => ((+id || 0) * 47 + 190) % 360;
const av = (s, big) => `<span class="av${big ? " big" : ""}" style="--h:${hue(s.id)}">${esc([...String(s.name || "").trim()][0] || "؟")}</span>`;
const arrow = d => d > 2 ? `<span class="ok sm">▲ ${fa(d)}</span>` : d < -2 ? `<span class="bad sm">▼ ${fa(-d)}</span>` : '<span class="mut sm">—</span>';
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
function ring(v, size = 104) {
  const r = 40, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 100 100" style="width:${size}px;flex:none" role="img" aria-label="نمره ${fa(v, 0)}"><circle cx="50" cy="50" r="${r}" fill="none" style="stroke:color-mix(in srgb,${lc(v)} 16%,transparent)" stroke-width="10"/><circle class="ring-v" cx="50" cy="50" r="${r}" fill="none" style="stroke:${lc(v)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c * clamp(v) / 100} ${c}" transform="rotate(-90 50 50)"/><text x="50" y="60" text-anchor="middle" font-size="28" font-weight="800" style="fill:var(--ink)">${fa(v, 0)}</text></svg>`;
}
function bars(vals, labels) {
  const n = vals.length;
  if (!n) return '<p class="mut sm">هنوز داده‌ای نیست.</p>';
  return `<div class="bars">${vals.map((v, i) => `<div class="bc${i === n - 1 ? " now" : ""}" style="--c:${lc(v)}"><em>${fa(v, 0)}</em><div class="col"><i style="height:${Math.max(4, clamp(v))}%"></i></div><small>${esc(labels[i])}</small></div>`).join("")}</div>`;
}
function msgFor(a, t, who) {
  let m = a >= 85 ? "عملکرد عالی است! 🌟" : a >= 70 ? "عملکرد خوب است؛ با کمی تلاش بیشتر عالی می‌شود 👍" : a >= 55 ? "در مسیر درست است؛ قدم‌به‌قدم بهتر می‌شود 📘" : who + " به حمایت و تمرین بیشتری نیاز دارد؛ قابل جبران است 💪";
  if (t > 2) m += " نسبت به هفته‌ی قبل پیشرفت داشته 📈"; else if (t < -2) m += " نسبت به هفته‌ی قبل کمی افت داشته.";
  return m;
}

// ---------- چرخه‌ی به‌روزرسانی ----------
let lastSig = "";
async function refresh(manual) {
  if (busy) return;
  busy = true; $("#rf").classList.add("spin");
  try {
    const changed = await pull();
    lastErr = "";
    if ((changed || !D) && PW) await unlockFromCache();
  } catch (e) {
    if (e.message === "BADPW") { PW = ""; LS.del("pw"); D = null; P = null; lastErr = ""; showLock("رمز داده اشتباه است"); }
    else lastErr = e.message;
  }
  busy = false; $("#rf").classList.remove("spin");
  if (!cfg().repo) showSetup(); else if (!D && lastErr && !LS.get("blob", "") && $("#ov").hidden) showSetup(lastErr);
  const sig = (LS.get("etag", "") || "") + "|" + lastErr + "|" + (D ? 1 : 0);
  if (manual || sig !== lastSig) { lastSig = sig; render(); }
  if (manual && !lastErr) toast("✔ به‌روز شد");
}
function toast(m) {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.style.cssText = "position:fixed;bottom:calc(96px + var(--sb));left:50%;transform:translateX(-50%);background:var(--hd);color:#fff;padding:9px 18px;border-radius:99px;z-index:30;font-size:13.5px;box-shadow:0 3px 0 #0003"; document.body.appendChild(t); }
  t.textContent = m; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 2200);
}

// ---------- صفحه‌ها ----------
function srow(s, lead, score) {
  const has = s.recs.length, v = score ?? s.avg;
  return `<a class="row" href="#/s/${s.id}" style="--c:${has ? lc(v) : "var(--mut)"}">${lead ? `<span class="rk">${lead}</span>` : ""}${av(s)}<span class="nm"><b>${esc(s.name)}</b><span class="mut sm">${esc([s.grade, s.class].filter(Boolean).join(" · ")) || "&nbsp;"}</span></span>${has ? arrow(s.trend) : ""}<span class="sc">${has ? fa(v) : "—"}</span><span class="go">‹</span></a>`;
}
function viewHome() {
  const { W, wavg, active } = P;
  if (!active.length) return '<div class="card mut" style="text-align:center">هنوز اطلاعاتی ثبت نشده است. 📭</div>';
  const n = W.length, lw = W[n - 1], cur = wavg[n - 1], dlt = n > 1 ? cur - wavg[n - 2] : 0;
  const rLW = D.records.filter(r => r.week === lw);
  const by = rLW.map(r => ({ r, s: P.st.get(r.student_id) })).filter(x => x.s).sort((a, b) => b.r.score - a.r.score);
  const cnt = [0, 1, 2, 3].map(i => rLW.filter(r => li(r.score) === i).length);
  const need = [...by].reverse().filter(x => x.r.score < 55).slice(0, 5);
  return `<div class="card sheet"><div class="hero">${ring(cur, 112)}<div class="t"><div class="mut sm">میانگین مدرسه · هفته‌ی ${wl(lw)}</div><div class="big">${fa(cur)}</div><div style="margin-top:4px">${stamp(cur)}</div><div class="sm" style="margin-top:6px">${arrow(dlt)} <span class="mut">نسبت به هفته‌ی قبل</span></div></div></div>
   <div class="note">${msgFor(cur, dlt, "مدرسه")}</div></div>
  ${by.length ? `<div><h3 class="sec">ستاره‌های این هفته</h3></div><div class="stars">${by.slice(0, 6).map(x => `<a class="star" href="#/s/${x.s.id}" style="--c:${lc(x.r.score)}">${av(x.s)}<b>${esc(x.s.name)}</b><span class="s">${fa(x.r.score)}</span></a>`).join("")}</div>` : ""}
  <div class="card"><h3>میانگین مدرسه در هفته‌های اخیر</h3>${bars(wavg.slice(-8), W.slice(-8).map(wl))}</div>
  <div class="card"><h3>وضعیت دانش‌آموزان این هفته</h3><div class="tiles">${LVL.map((l, i) => `<div class="tile" style="--c:var(--l${i + 1})"><i>${l[1]}</i><div><b>${fa(cnt[i], 0)}</b><span>${l[0]}</span></div></div>`).join("")}</div></div>
  ${need.length ? `<div class="card"><h3>نیاز به حمایت 🤝</h3>${need.map(x => srow(x.s, "", x.r.score)).join("")}</div>` : ""}`;
}
function viewRank() {
  const r = P.rank;
  if (!r.length) return '<div class="card mut" style="text-align:center">هنوز رتبه‌بندی‌ای وجود ندارد.</div>';
  const pod = r.length >= 3 ? `<div class="podium">${[1, 0, 2].map(i => { const s = r[i]; return `<a class="pd p${i + 1}" href="#/s/${s.id}" style="--c:${lc(s.avg)}">${av(s)}<b>${esc(s.name)}</b><div class="mut sm">${fa(s.avg)}</div><div class="blk">${["🥇", "🥈", "🥉"][i]}</div></a>`; }).join("")}</div>` : "";
  const rest = r.length >= 3 ? r.slice(3) : r, off = r.length >= 3 ? 3 : 0;
  return `<div class="card"><h3>برترین‌ها بر اساس میانگین نمره</h3>${pod}${rest.map((s, i) => srow(s, fa(i + 1 + off, 0))).join("")}</div>`;
}
let QF = { q: "", cls: "" };
function listHTML() {
  const q = QF.q.trim();
  const a = P.S.filter(s => (!QF.cls || s.class === QF.cls) && (!q || (s.name + " " + (s.code || "")).includes(q))).sort((x, y) => x.name.localeCompare(y.name, "fa"));
  return a.map(s => srow(s)).join("") || '<p class="mut" style="padding:10px;text-align:center">موردی پیدا نشد 🔎</p>';
}
function viewStudents() {
  return `<div class="srch"><input id="q" type="search" placeholder="جستجوی نام یا کد دانش‌آموز…" value="${esc(QF.q)}" autocomplete="off"></div>
  ${P.classes.length > 1 ? `<div class="chips"><span class="chip ${QF.cls ? "" : "on"}" data-c="">همه</span>${P.classes.map(c => `<span class="chip ${QF.cls === c ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</span>`).join("")}</div>` : ""}
  <div class="card" id="lst" style="margin-top:12px;padding:6px 14px">${listHTML()}</div>`;
}
function viewStudent(id) {
  const s = P.st.get(+id), back = '<a class="back" href="#/students" onclick="if(history.length>1){history.back();return false}">› بازگشت</a>';
  if (!s) return back + '<div class="card mut">دانش‌آموز پیدا نشد.</div>';
  const l = s.last, rk = P.rank.indexOf(s) + 1;
  const meta = [s.grade, s.class && "کلاس " + s.class, s.code && "کد " + s.code].filter(Boolean).join(" · ");
  let h = `${back}<div class="card sheet"><div class="hero">${av(s, true)}<div class="t"><h2 style="font-size:20px">${esc(s.name)}</h2><div class="mut sm">${esc(meta)}</div></div></div>`;
  if (!l) return h + '<div class="note">هنوز کارنامه‌ای برای این دانش‌آموز ثبت نشده است. 📭</div></div>';
  h += `<div class="hero" style="margin-top:16px">${ring(s.avg, 108)}<div class="t"><div class="mut sm">میانگین کل نمره‌ها</div><div style="margin:4px 0 8px">${stamp(s.avg)}</div>
   <div class="sm">${arrow(s.trend)} <span class="mut">نسبت به هفته‌ی قبل</span></div>${rk ? `<div style="margin-top:6px"><span class="pill" style="--c:var(--ink)">🏅 رتبه ${fa(rk, 0)} از ${fa(P.rank.length, 0)}</span></div>` : ""}</div></div>
   <div class="note">${msgFor(s.avg, s.trend, "دانش‌آموز")}</div></div>`;
  const th = +(D.settings && D.settings.th) || 20, ts = +(D.settings && D.settings.ts) || 100;
  const M = [["📚", "مطالعه", `${fa(l.hours)} از ${fa(th, 0)} ساعت`, l.hours / th], ["✏️", "سوال حل‌شده", `${fa(l.solved, 0)} از ${fa(ts, 0)}`, l.solved / ts], ["⭐", "نمره کیفی", `${fa(l.quality)} از ۲۰`, l.quality / 20], ["📝", "تکلیف", `${fa(l.homework, 0)}٪`, l.homework / 100], ["🏫", "حضور", `${fa(l.attendance, 0)}٪`, l.attendance / 100]];
  h += `<div class="card"><h3>هفته‌ی ${wl(l.week)} · نمره ${fa(l.score)}</h3>${M.map(m => `<div class="m" style="--c:${rl(m[3])}"><i>${m[0]}</i><span>${m[1]}</span><b>${m[2]}</b><div class="pb"><u style="width:${clamp(m[3] * 100)}%"></u></div></div>`).join("")}</div>
  <div class="card"><h3>نمره‌های هفتگی</h3>${bars(s.recs.slice(-8).map(r => r.score), s.recs.slice(-8).map(r => wl(r.week)))}</div>
  <div class="card"><h3>دفترچه‌ی هفته‌ها</h3>${[...s.recs].reverse().map(r => `<div class="wk"><div class="h"><b>هفته‌ی ${wl(r.week)}</b>${pill(r.score)}<b style="color:${lc(r.score)}">${fa(r.score)}</b></div>
   <div class="d">📚 ${fa(r.hours)} ساعت · ✏️ ${fa(r.solved, 0)} سوال · ⭐ ${fa(r.quality)} · 📝 ${fa(r.homework, 0)}٪ · 🏫 ${fa(r.attendance, 0)}٪</div>${r.note ? `<div class="note" style="margin-top:8px">📝 ${esc(r.note)}</div>` : ""}</div>`).join("")}</div>`;
  return h;
}
let lastRoute = "";
function render() {
  if (!P) { $("#app").className = ""; $("#app").innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>'; $("#nav").hidden = true; return; }
  $("#nav").hidden = false;
  const h = location.hash.replace(/^#/, "") || "/", seg = h.split("/");
  const t = seg[1] === "rank" ? "rank" : seg[1] === "students" || seg[1] === "s" ? "students" : "home";
  const changed = h !== lastRoute, y = window.scrollY; lastRoute = h;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.t === t));
  $("#ttl").firstChild.textContent = (D.srv && D.srv.school) || "کارنامه مدرسه";
  $("#sub").textContent = D.srv && D.srv.teacher ? D.srv.teacher : "";
  const when = D.updated_at ? new Date(D.updated_at).toLocaleString("fa-IR", { dateStyle: "medium", timeStyle: "short" }) : "";
  const stt = lastErr ? `<div class="err">${esc(lastErr)}${online ? "" : " · آخرین داده‌ی ذخیره‌شده نمایش داده می‌شود"}</div>` : `<div class="status">آخرین به‌روزرسانی داده: ${esc(when) || "—"}</div>`;
  $("#app").className = changed ? "anim" : "";
  $("#app").innerHTML = stt + (t === "rank" ? viewRank() : seg[1] === "s" ? viewStudent(seg[2]) : t === "students" ? viewStudents() : viewHome());
  window.scrollTo(0, changed ? 0 : y);
}

// ---------- ورود، تنظیمات ----------
const SCHOOL_SVG = '<svg viewBox="0 0 200 150" aria-hidden="true"><path d="M100 18V2" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><path d="M100 3l26 7-26 7z" fill="var(--red)"/><rect x="28" y="62" width="144" height="78" rx="7" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/><path d="M18 64L100 18l82 46z" fill="var(--hd)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/><rect x="85" y="94" width="30" height="46" rx="5" fill="var(--pencil)" stroke="var(--ink)" stroke-width="3"/><rect x="42" y="78" width="28" height="24" rx="4" fill="#9ad0ff" stroke="var(--ink)" stroke-width="3"/><rect x="130" y="78" width="28" height="24" rx="4" fill="#9ad0ff" stroke="var(--ink)" stroke-width="3"/><circle cx="100" cy="48" r="9" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/><path d="M100 43v5h4" stroke="var(--ink)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
function ov(html) { const o = $("#ov"); o.innerHTML = `<div class="box" style="text-align:center">${html}</div>`; o.hidden = false; o.scrollTop = 0; }
function showLock(err) {
  ov(`${SCHOOL_SVG}<h2>به کارنامه‌ی مدرسه خوش آمدید 👋</h2><p class="mut" style="margin:0 0 14px">رمزی را که مدرسه به شما داده وارد کنید.</p>${err ? `<div class="err">${esc(err)}</div>` : ""}
  <div style="text-align:start"><label>رمز داده<input id="lpw" type="password" autocomplete="current-password"></label>
  <label style="display:flex;gap:9px;align-items:center;color:var(--ink)"><input id="lrem" type="checkbox" style="width:auto;margin:0"> به‌خاطر سپردن روی این گوشی</label></div>
  <div class="bar" style="justify-content:center"><button class="btn" id="lgo">ورود</button><button class="btn g" id="lset">تنظیمات اتصال</button></div><p class="mut sm" id="lmsg"></p>`);
  $("#lpw").focus();
  $("#lpw").onkeydown = e => { if (e.key === "Enter") $("#lgo").click(); };
  $("#lset").onclick = () => showSetup();
  $("#lgo").onclick = async () => {
    const pw = $("#lpw").value; if (!pw) return;
    $("#lmsg").textContent = "در حال بررسی…";
    PW = pw;
    try {
      if (!LS.get("blob", "")) await pull();
      await unlockFromCache();
      if ($("#lrem").checked) LS.set("pw", PW);
      $("#ov").hidden = true; lastErr = ""; render();
    } catch (e) { PW = ""; showLock(e.message === "BADPW" ? "رمز داده اشتباه است" : e.message); }
  };
}
function showSetup(err) {
  const c = cfg();
  ov(`${SCHOOL_SVG}<h2>اتصال به مدرسه</h2>${err ? `<div class="err">${esc(err)}</div>` : ""}
  <div style="text-align:start;margin-top:10px">
  <label>ریپوی داده (USERNAME/REPO)<input id="s_repo" dir="ltr" value="${esc(c.repo || "")}" placeholder="myschool/school-data"></label>
  <label>توکن GitHub (فقط برای ریپوی خصوصی، فقط‌خواندنی)<input id="s_tok" dir="ltr" type="password" autocomplete="off" value="${esc(TOK)}" placeholder="github_pat_…"></label>
  <label>نام فایل<input id="s_path" dir="ltr" value="${esc(c.path)}"></label>
  <label>شاخه (خالی = پیش‌فرض)<input id="s_br" dir="ltr" value="${esc(c.branch)}"></label>
  <label>به‌روزرسانی خودکار (دقیقه)<input id="s_min" type="number" min="1" max="120" value="${esc(c.refreshMinutes)}"></label></div>
  <div class="bar" style="justify-content:center"><button class="btn" id="s_ok">ذخیره و اتصال</button>${D || LS.get("blob", "") ? '<button class="btn g" id="s_x">بستن</button>' : ""}</div>
  ${D ? `<div class="bar" style="justify-content:center;margin-top:22px"><button class="btn d" id="s_out">خروج و پاک‌کردن اطلاعات این گوشی</button></div>` : ""}`);
  $("#s_ok").onclick = () => {
    const repo = $("#s_repo").value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return showSetup("نام ریپو باید به شکل USERNAME/REPO باشد");
    LS.set("cfg", { repo, path: $("#s_path").value.trim() || "data.enc.json", branch: $("#s_br").value.trim(), refreshMinutes: Math.max(1, +$("#s_min").value || 5) });
    TOK = $("#s_tok").value.trim(); TOK ? LS.set("tok", TOK) : LS.del("tok");
    LS.del("blob"); LS.del("etag"); D = P = null;
    $("#ov").hidden = true; if (PW) refresh(); else { showLock(); refresh(); }
  };
  if ($("#s_x")) $("#s_x").onclick = () => { $("#ov").hidden = true; };
  if ($("#s_out")) $("#s_out").onclick = () => { ["pw", "blob", "etag", "tok"].forEach(LS.del); PW = TOK = ""; D = P = null; $("#ov").hidden = true; render(); showLock(); };
}

// ---------- راه‌اندازی ----------
$("#rf").onclick = () => refresh(true);
$("#gear").onclick = () => showSetup();
$("#app").addEventListener("input", e => { if (e.target.id === "q") { QF.q = e.target.value; $("#lst").innerHTML = listHTML(); } });
$("#app").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) { QF.cls = c.dataset.c; render(); } });
window.addEventListener("hashchange", () => P && render());
document.addEventListener("visibilitychange", () => { if (!document.hidden && D) refresh(); });
setInterval(() => { if (!document.hidden && D) refresh(); }, Math.max(1, +cfg().refreshMinutes || 5) * 60000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
(async function init() {
  if (!cfg().repo) { showSetup(); return; }
  if (!PW) { showLock(); refresh(); return; }
  try { await unlockFromCache(); render(); } catch { PW = ""; LS.del("pw"); showLock(); }
  refresh();
})();

</script>
</body>
</html>
